# Development database only (`pnpm dev` expects it on localhost:5432). The prod-like
# stack (the built image + its own database) is docker-compose.prod.yml.
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: worksheet
      POSTGRES_PASSWORD: worksheet
      POSTGRES_DB: worksheet
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U worksheet"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
