services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: worksheet
      POSTGRES_PASSWORD: worksheet
      POSTGRES_DB: worksheet
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U worksheet"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DATABASE_URL: postgres://worksheet:worksheet@postgres:5432/worksheet
      # Local prod-like stack only; NODE_ENV=production requires >= 32 chars. Real deployments set their own.
      COOKIE_SECRET: local-compose-only-cookie-secret-0123456789
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
